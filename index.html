<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mascot</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="stage">
      <!-- ドット絵のキャラクター。中身は main.ts でスプライト定義から生成する。
           SVG は描画された図形の上だけがヒット判定されるため、
           elementFromPoint で「不透明部分に重なっているか」を判定できる -->
      <svg
        id="mascot"
        viewBox="0 0 16 16"
        shape-rendering="crispEdges"
        xmlns="http://www.w3.org/2000/svg"
      ></svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
