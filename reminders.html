<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>リマインダー</title>
    <link rel="stylesheet" href="/src/reminders.css" />
  </head>
  <body>
    <main>
      <form id="form" autocomplete="off">
        <label>
          内容
          <input id="text" type="text" maxlength="100" placeholder="例：会議の準備" required />
        </label>
        <div class="when-row">
          <label>
            日付
            <input id="date" type="date" required />
          </label>
          <label>
            時刻
            <input id="time" type="time" required />
          </label>
        </div>
        <div class="quick" aria-label="日時のかんたん設定">
          <button type="button" data-min="5">5 分後</button>
          <button type="button" data-min="15">15 分後</button>
          <button type="button" data-min="30">30 分後</button>
          <button type="button" data-min="60">1 時間後</button>
        </div>
        <label>
          くり返し
          <select id="repeat">
            <option value="once">しない</option>
            <option value="daily">毎日</option>
            <option value="weekdays">平日（月〜金）</option>
            <option value="weekly">毎週</option>
            <option value="biweekly">隔週</option>
            <option value="monthly">毎月</option>
            <option value="days">曜日を選ぶ</option>
          </select>
        </label>
        <div id="days" class="days" hidden aria-label="くり返す曜日">
          <label><input type="checkbox" value="0" />月</label>
          <label><input type="checkbox" value="1" />火</label>
          <label><input type="checkbox" value="2" />水</label>
          <label><input type="checkbox" value="3" />木</label>
          <label><input type="checkbox" value="4" />金</label>
          <label><input type="checkbox" value="5" />土</label>
          <label><input type="checkbox" value="6" />日</label>
        </div>
        <p id="error" role="alert"></p>
        <div class="buttons">
          <button id="add" type="submit">追加</button>
          <button id="cancel" type="button" hidden>キャンセル</button>
        </div>
      </form>

      <div class="list-head">
        <h2 id="list-title">登録済み</h2>
        <label class="sort">
          並べ方
          <select id="sort">
            <option value="time">日時順</option>
            <option value="added">登録順</option>
          </select>
        </label>
      </div>
      <ul id="list"></ul>
      <p id="empty">リマインダーはありません</p>
    </main>
    <script type="module" src="/src/reminders.ts"></script>
  </body>
</html>
