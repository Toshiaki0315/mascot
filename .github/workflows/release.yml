# v で始まるタグを push すると、dmg をビルドして GitHub のリリースに添付する。
# リリースがまだなければ自動生成のリリースノートで作り、すでにあれば dmg だけを追加する
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon のランナー
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: タグとアプリのバージョンが一致しているか確認
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tauri.conf.json の version (v$version) とタグ ($GITHUB_REF_NAME) が一致しません"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build -- --bundles dmg

      - name: リリースに dmg を添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # ファイル名の空白は GitHub で "." に置き換わるので、ハイフンにしておく
          asset="Desktop-Mascot_${version}_aarch64.dmg"
          cp "src-tauri/target/release/bundle/dmg/Desktop Mascot_${version}_aarch64.dmg" "$asset"
          shasum -a 256 "$asset"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" --generate-notes
          fi
