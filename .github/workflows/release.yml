# v で始まるタグを push すると、dmg をビルドして GitHub のリリースに添付する。
# リリースがまだなければ、コミットから作った下書きのリリースノート（scripts/release-notes.mjs）で作り、
# すでにあれば dmg だけを追加・差し替える。
#
# Actions の画面から手動でも実行できる（workflow_dispatch）。
#   - tag を空にすると、ビルドだけして dmg を Actions の成果物に置く（試しにビルドしたい時）
#   - tag を指定すると、そのタグのコードでビルドし直して、リリースの dmg を差し替える
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "dmg を作り直して差し替えるリリースのタグ（例: v0.5.0）。空ならビルドだけ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon のランナー
    runs-on: macos-latest
    env:
      # タグの push ならそのタグ、手動実行なら入力されたタグ（空ならリリースしない）
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG || github.ref }}
          # リリースノートの下書きに、前のタグからのコミットを使う
          fetch-depth: 0

      - name: タグとアプリのバージョンが一致しているか確認
        if: env.TAG != ''
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tauri.conf.json の version (v$version) とタグ ($TAG) が一致しません"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: dmg をビルド
        # Tauri は CI=true の環境では、Finder でアイコンの大きさや並びを整える処理を飛ばす。
        # 手元でビルドした dmg と同じ見た目にするため、飛ばさないようにする
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: npm run tauri build -- --bundles dmg

      - name: dmg の名前をそろえる
        id: files
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          # ファイル名の空白は GitHub で "." に置き換わるので、ハイフンにしておく
          dmg="out/Desktop-Mascot_${version}_aarch64.dmg"
          cp "src-tauri/target/release/bundle/dmg/Desktop Mascot_${version}_aarch64.dmg" "$dmg"
          shasum -a 256 "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: 成果物として置く（ビルドだけの時）
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: ${{ steps.files.outputs.dmg }}

      - name: リリースに dmg を添付
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.files.outputs.dmg }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            node scripts/release-notes.mjs "$TAG" > out/notes.md
            gh release create "$TAG" "$DMG" --title "$TAG" --notes-file out/notes.md
          fi
